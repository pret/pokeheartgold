name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CC: gcc-15
  CXX: g++-15
  COMPARE: 1

jobs:
  build:
    name: Build CI test
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/pret/pokeheartgold@sha256:4efa58f34f8ed0cead849db649ec37aac082a829c18f87fc6d22a51da819cf24
      options: --memory-swap -1
    strategy:
      matrix:
        GAME_VERSION:
          - env: HEARTGOLD
            name: heartgold
          - env: SOULSILVER
            name: soulsilver
        GAME_LANGUAGE:
          - env: ENGLISH
            name: us
        GAME_REVISION:
          - 0
    outputs:
      build-name: "${{ matrix.GAME_VERSION.name }}.${{ matrix.GAME_LANGUAGE.name }}"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ROM - ${{ matrix.GAME_VERSION.name }} - ${{ matrix.GAME_LANGUAGE.name }} - ${{ matrix.GAME_REVISION }}
        env:
          GAME_VERSION: ${{ matrix.GAME_VERSION.env }}
          GAME_LANGUAGE: ${{ matrix.GAME_LANGUAGE.env }}
          GAME_REVISION: ${{ matrix.GAME_REVISION }}
        run: make -j4

      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' }}
        with:
          path: build/
          retention-days: 1

  report-status:
    name: Report build status to Discord
    runs-on: ubuntu-26.04
    needs: [build]
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Calcrom
        id: calcrom
        uses: ./.github/actions/calcrom/
        with:
          romnames: ${{ needs.build.outputs.build-name }}

      - name: Webhook
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOKURL }}
          content: |
            pokeheartgold progress:
            ```
            ${{ steps.calcrom.outputs.calcrom_output }}
            ```
          username: OK
          avatar-url: https://i.imgur.com/38BQHdd.png
        continue-on-error: true

  update-xmap:
    name: Update xMAP
    runs-on: ubuntu-26.04
    needs: [build]
    if: github.event_name == 'push' && github.repository == 'pret/pokeheartgold'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get commit message
        run: |
          echo "XMAP_COMMIT_MSG=$( git log --format=%s HEAD )" >> $GITHUB_ENV

      - name: Checkout xMAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "xmap"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Move xMAP
        run: |
          mkdir -p xmap
          for buildname in ${{ needs.build.outputs.build-name }}; do
            xmapname=${build-name//./}
            cp build/$buildname/*.xMAP $xmapname.xMAP
          done

      - name: Update xMAP
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: "*.xMAP"
          message: ${{ env.XMAP_COMMIT_MSG }}
