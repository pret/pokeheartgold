name: calcrom

description: |
  Runs the rust reimplementation of calcrom

inputs:
  repodir:
    description: |
      Root of the ROM source tree
    default: "${{ github.workspace }}"
  romnames:
    description: |
      Names of the ROMs to analyze
  arm9subdir:
    description: |
      Subdirectory containing ARM9 sources
    default: '""'
  arm7subdir:
    description: |
      Subdirectory containing ARM7 sources
    default: ''
  arm9stem:
    description: |
      Name of the ARM9 binary
    default: main
  arm7stem:
    description: |
      Name of the ARM7 binary
    default: ichneumon_sub

outputs:
  calcrom_output:
    description: |
      Text output from the calcrom utility
    value: ${{ steps.calcrom.outputs.calcrom_output }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: PikalaxALT/pokeheartgold-calcrom
        ref: 3579b8f68bba183c8a2b78a60d109dec352893a3 # v0.1.3
        path: calcrom
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        rust-src-dir: calcrom
    - shell: bash
      id: calcrom
      run: |
        set +e
        echo 'calcrom_output<<EOF' >> "$GITHUB_OUTPUT"
        cargo run --manifest-path calcrom/Cargo.toml ${{ runner.debug || '--release' }} -- \
          -d "${{ inputs.repodir }}" \
          ${{ inputs.arm9subdir && '-9' || '' }} ${{ inputs.arm9subdir }} \
          ${{ inputs.arm7subdir && '-7' || '' }} ${{ inputs.arm7subdir }} \
          -m "${{ inputs.arm9stem }}" \
          -s "${{ inputs.arm7stem }}" \
          ${{ inputs.romnames }} | tee -a "$GITHUB_OUTPUT"
        COMMAND_STATUS=$?
        ( echo ; echo 'EOF' ) >> "$GITHUB_OUTPUT"
        exit $COMMAND_STATUS
